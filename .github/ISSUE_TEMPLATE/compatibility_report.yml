name: Compatibility report
description: Report a test result for a LIXIL camera model
title: "[Compatibility]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping expand the verified-model list. **Never include the security code (SC), the full QR-code contents, a camera password, a full serial number, or a publicly reachable address.** A masked serial such as `59F0…7181` is enough.
  - type: input
    id: model
    attributes:
      label: Camera model
      placeholder: "LS279"
    validations:
      required: true
  - type: input
    id: pid
    attributes:
      label: PID from the manual QR code
      description: The PID identifies the product model. Do not paste the full QR contents.
      placeholder: "PID only"
    validations:
      required: false
  - type: input
    id: firmware
    attributes:
      label: Camera firmware
    validations:
      required: false
  - type: input
    id: versions
    attributes:
      label: Home Assistant / ha-dahua / LIXIL Companion versions
      placeholder: "HA 2026.10.2 / ha-dahua x.y.z / Companion 0.2.0"
    validations:
      required: true
  - type: checkboxes
    id: results
    attributes:
      label: What did you test?
      options:
        - label: LAN scan found the camera
        - label: DHCP discovery offered setup
        - label: QR wizard completed and created the ha-dahua entry
        - label: Live view or snapshot worked
        - label: Guardian found the camera after an IP change
        - label: Guardian entities and Rescan button appeared
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Mention anything model-specific, including partial failures. Redact credentials and private identifiers.
    validations:
      required: false
